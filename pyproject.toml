[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docjev"
version = "0.0.1"
description = "Calibrated, non-autoregressive typed decisions over document images"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
loop0 = ["pillow>=10", "requests>=2.31", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
